<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Widget - Demo</title>
  <!-- config.js debe cargarse primero para que window.env esté disponible -->
  <script src="/config.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    .demo-container { max-width: 800px; margin: 0 auto; }
    .demo-header, .demo-content {
      background: white;
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    .demo-header h1 { color: #1f2937; margin-bottom: 0.5rem; }
    .demo-header p { color: #6b7280; }
    .demo-content h2 { color: #1f2937; margin-bottom: 1rem; font-size: 1.25rem; }
    .demo-controls { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .demo-btn {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .demo-btn-primary { background: #be1717; color: white; }
    .demo-btn-primary:hover { background: #9a1212; }
    .demo-btn-secondary { background: #f3f4f6; color: #374151; }
    .demo-btn-secondary:hover { background: #e5e7eb; }
    .status {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    .status.success { background: #dcfce7; color: #166534; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .status.loading { background: #fef3c7; color: #92400e; }
    .demo-info {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .demo-info p { color: #0369a1; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-header">
      <h1>Chatbot Widget Demo</h1>
      <p>Widget de chatbot embebible estilo WhatsApp</p>
    </div>

    <div class="demo-content">
      <h2>Controles</h2>
      <div class="demo-controls">
        <button class="demo-btn demo-btn-primary" id="btn-open">Abrir Chat</button>
        <button class="demo-btn demo-btn-secondary" id="btn-close">Cerrar Chat</button>
        <button class="demo-btn demo-btn-secondary" id="btn-toggle">Toggle Chat</button>
        <button class="demo-btn demo-btn-secondary" id="btn-theme">Toggle Tema</button>
      </div>

      <div id="status" class="status loading">Cargando widget...</div>

      <div class="demo-info">
        <p>
          <strong>Instrucciones:</strong> El boton rojo flotante aparecera en la esquina inferior derecha.
          Haz clic en el para abrir el chat.
        </p>
      </div>
    </div>
  </div>

  <!-- Bundle compilado del widget (generado por pnpm build) -->
  <script type="module">
    import { ChatbotWidget } from '/chatbot-widget.es.js';

    const statusEl = document.getElementById('status');
    function setStatus(type, message) {
      statusEl.className = 'status ' + type;
      statusEl.textContent = message;
    }

    // Leer URL del WebSocket desde window.env (inyectado por entrypoint.prd.sh en runtime)
    const wsBase = (
      window.env?.VITE_WEBSOCKET_URL || 'ws://localhost:5010/api/v1'
    ).replace(/\/$/, '');

    // Generar userId único por sesión de navegador
    const userId = crypto.randomUUID();
    const websocketUrl = `${wsBase}/ws/${userId}`;

    try {
      ChatbotWidget.init({
        projectId: 'demo',
        endpoints: { websocket: websocketUrl },
        bot: {
          name: 'Eleccia Comunicaciones',
          welcomeMessage: 'Bienvenido al Jurado Nacional de Elecciones. En que puedo ayudarte?',
        },
        position: 'bottom-right',
        autoOpen: false,
        onReady: () => {
          setStatus('success', 'Widget cargado. Haz clic en el boton de la esquina inferior derecha.');
        },
        onError: (error) => {
          setStatus('error', 'Error: ' + error.message);
        },
      });

      document.getElementById('btn-open').addEventListener('click', () => {
        ChatbotWidget.getInstance()?.open();
      });
      document.getElementById('btn-close').addEventListener('click', () => {
        ChatbotWidget.getInstance()?.close();
      });
      document.getElementById('btn-toggle').addEventListener('click', () => {
        ChatbotWidget.getInstance()?.toggle();
      });
      let isDark = false;
      document.getElementById('btn-theme').addEventListener('click', () => {
        isDark = !isDark;
        ChatbotWidget.getInstance()?.setThemeMode(isDark ? 'dark' : 'light');
      });

    } catch (error) {
      setStatus('error', 'Error al cargar: ' + error.message);
    }
  </script>
</body>
</html>
